# TodoTim — native macOS Todoist clone that syncs to Nextcloud over WebDAV.
# https://github.com/timvink/todotim
#
# Managed by chezmoi (dot_todotim.toml). While this file has a [sync] table the
# app uses it instead of its Settings window, which shows the fields read-only.
repository = "https://github.com/timvink/todotim"

[sync]
enabled = true
# Homelab Nextcloud; reachable on the LAN and through NetBird elsewhere.
server_url = "https://nextcloud.home.timvink.nl/remote.php/dav/files/timvink/"
username = "timvink"
folder = "TodoTim"
# A Nextcloud app password of its own ("TodoTim (macOS)" under Settings >
# Security > Devices & sessions), not the login password, so it can be revoked
# without touching anything else. Runs once when the Keychain has no password
# for this user; TodoTim then keeps it in the Keychain ("TodoTim WebDAV").
# Needs an unlocked rbw vault that time.
password_command = "rbw get 'Nextcloud TodoTim app password (homelab)' timvink"
