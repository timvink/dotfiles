#!/usr/bin/env python3
# chezmoi modify_ script for ~/.config/cliamp/config.toml.
#
# `cliamp setup` owns this file at runtime: its interactive wizard appends a
# block per provider you configure (Navidrome, Plex, Spotify, ...). Managing it
# as a static file would drop any provider added after this was checked in, so
# we manage only the [spotify] block and pass everything else through as-is.
# On a fresh machine with no config yet, this seeds [spotify] straight away —
# no need to re-run `cliamp setup` just for Spotify.
#
# client_id is a Spotify Developer app ID, not a secret: cliamp authorizes it
# via OAuth PKCE against a loopback redirect (http://127.0.0.1:19872/login), no
# client_secret involved. See docs/spotify.md in bjarneo/cliamp.
#
# chezmoi feeds the current target file on stdin; we emit the desired file.
import re
import sys

CLIENT_ID = "b6e6d3a8db5546eea5a6efac842cce40"
BITRATE = 320
SPOTIFY_BLOCK = f'[spotify]\nclient_id = "{CLIENT_ID}"\nbitrate = {BITRATE}\n'

src = sys.stdin.read()


def group_of(header):
    m = re.match(r'\[+\s*"?([^".\]]+)', header)
    return m.group(1) if m else None


# Split into blocks at column-0 table headers ("[..."). The first block (if it
# doesn't start with "[") is the preamble — top-level keys like `theme`.
blocks, cur = [], []
for ln in src.splitlines(keepends=True):
    if ln.startswith('['):
        if cur:
            blocks.append(cur)
        cur = [ln]
    else:
        cur.append(ln)
if cur:
    blocks.append(cur)

out, replaced = [], False
for b in blocks:
    if b[0].startswith('[') and group_of(b[0]) == 'spotify':
        out.append(SPOTIFY_BLOCK)
        replaced = True
    else:
        out.append(''.join(b))

if not replaced:
    out.append(SPOTIFY_BLOCK)

sys.stdout.write(''.join(out).rstrip() + '\n')
