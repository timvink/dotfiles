# Omarchy only (ignored elsewhere in .chezmoiignore). My config is ~/.tmux.conf
# (dot_tmux.conf), which tmux loads in preference to this file. Omarchy's own
# tools — omarchy-restart-tmux, `omarchy refresh tmux`, its migrations — source
# this path into a running server, so it forwards to the real config instead of
# holding Omarchy's default one.
source-file ~/.tmux.conf
