# tmux plugins, pinned to release tags and loaded straight from dot_tmux.conf
# with run-shell (no TPM). Bump the tag here to upgrade; `exact` removes files
# an older release had that the new one dropped.
[".tmux/plugins/tmux-resurrect"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tmux-resurrect/archive/refs/tags/v4.0.0.tar.gz"
    exact = true
    stripComponents = 1

[".tmux/plugins/tmux-continuum"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tmux-continuum/archive/refs/tags/v3.1.0.tar.gz"
    exact = true
    stripComponents = 1

# Obsidian Vimrc Support plugin: loads the vault's .obsidian.vimrc (Space
# chords). Release assets pinned to a tag; bump both URLs to upgrade. Only
# where the vault exists (gated with Obsidian in .chezmoiignore). Enabled by
# Obsidian/vault/dot_obsidian/modify_community-plugins.json.
["Obsidian/vault/.obsidian/plugins/obsidian-vimrc-support/main.js"]
    type = "file"
    url = "https://github.com/esm7/obsidian-vimrc-support/releases/download/0.10.2/main.js"

["Obsidian/vault/.obsidian/plugins/obsidian-vimrc-support/manifest.json"]
    type = "file"
    url = "https://github.com/esm7/obsidian-vimrc-support/releases/download/0.10.2/manifest.json"
