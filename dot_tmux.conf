# ~/.tmux.conf — managed by chezmoi (dot_tmux.conf)
#
# Mental model:
#   session = "workspace"     — top-level grouping (e.g. one per project)
#   window  = "terminal tab"  — horizontal tabs within a workspace
#   pane    = a split inside a tab
#
# Navigation uses Alt/Option with no prefix. Option must reach tmux as Meta:
# in Ghostty that's `macos-option-as-alt`. Works locally and over SSH.

#### Palette — Catppuccin Mocha, overridable by the Omarchy theme ####
# Every colour below is read from these @thm_* options: formats use
# #{@thm_x}, and the scripts that emit colours (tmux-agent-count,
# tmux-git-branch, tmux-session-dots, tmux-sessionizer, tmux-url-open,
# tmux-overview) ask tmux for them, falling back to these same values when the
# option is unset. Names follow Omarchy's colors.toml keys:
#
#   @thm_bg         base      #1e1e2e   background
#   @thm_bg_dark    mantle    #181825   dark_background
#   @thm_surface    surface0  #313244   lighter_background
#   @thm_selection  surface1  #45475a   selection
#   @thm_muted      surface2  #585b70   muted
#   @thm_fg_dim     overlay0  #6c7086   dark_foreground
#   @thm_fg_sub     subtext0  #a6adc8   light_foreground
#   @thm_fg         text      #cdd6f4   foreground
#   @thm_fg_bright            #ebebf5   bright_foreground  (overview tab title)
#   @thm_accent     mauve     #cba6f7   accent  (session badge, active index)
#   @thm_blue/green/red/yellow          the same keys
#   @thm_cyan       sapphire  #74c7ec   cyan    (subagent count)
#   @thm_orange     peach     #fab387   orange  (worktree marker)
#   @thm_red_soft   maroon    #eba0ac   bright_red  (SSH plug)
#   @thm_green_tint           #caeec7   port on the active tab: a lighter
#                                       green; themes derive green 60% +
#                                       foreground 40%
#   @thm_ssh_bg               #3d3017   status bar of a server started over
#                                       SSH: dark amber; themes derive
#                                       yellow 25% + dark_background
#
# On Omarchy ~/.config/tmux/theme.conf overrides them: the theme-set hook
# (dot_config/omarchy/hooks/theme-set.d/executable_tmux-theme) writes it from
# the current theme's colors.toml and re-sources this file. Elsewhere the file
# doesn't exist and -q keeps it quiet. Options that hold a style rather than a
# format are set with -F further down, so they take the value at load time —
# which is why a theme switch re-sources this whole file.
set -g @thm_bg         "#1e1e2e"
set -g @thm_bg_dark    "#181825"
set -g @thm_surface    "#313244"
set -g @thm_selection  "#45475a"
set -g @thm_muted      "#585b70"
set -g @thm_fg_dim     "#6c7086"
set -g @thm_fg_sub     "#a6adc8"
set -g @thm_fg         "#cdd6f4"
set -g @thm_fg_bright  "#ebebf5"
set -g @thm_accent     "#cba6f7"
set -g @thm_blue       "#89b4fa"
set -g @thm_green      "#a6e3a1"
set -g @thm_red        "#f38ba8"
set -g @thm_yellow     "#f9e2af"
set -g @thm_cyan       "#74c7ec"
set -g @thm_orange     "#fab387"
set -g @thm_red_soft   "#eba0ac"
set -g @thm_green_tint "#caeec7"
set -g @thm_ssh_bg     "#3d3017"
source-file -q ~/.config/tmux/theme.conf

#### Navigation — alt+hjkl, mirroring the cross-tool design ####

# Terminal tabs (windows): Alt+h / Alt+l to switch, Alt+Shift+h / Alt+Shift+l
# to swap the current tab left/right. `-d` keeps the focused pane in place
# while the window moves, so visual context doesn't jump.
#
# Shift bindings are doubled: with `extended-keys on` (below) Ghostty sends
# Alt+Shift+h as the CSI-u key M-S-H — uppercase codepoint *plus* the shift
# modifier, NOT M-S-h. A terminal that hasn't negotiated extended keys sends
# the legacy M-H. Bind both so the swap works either way. (M-S-h, the
# lowercase+shift form, is never produced here — don't bind it.)
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-H   swap-window -d -t -1
bind -n M-S-H swap-window -d -t -1
bind -n M-L   swap-window -d -t +1
bind -n M-S-L swap-window -d -t +1

# PageUp / PageDown also switch tabs (prev / next), an Alt-free alias for the
# M-h / M-l above. On the phone (Termius over SSH) the Option/Meta key is awkward
# to send, but Page keys are on the soft keyboard, so this keeps tab navigation
# one-tap there. Tradeoff: rooting them (`-n`) means tmux eats PageUp/PageDown
# globally, so apps inside tmux (vim, less, htop) no longer get them for their
# own scrolling — use prefix+[ (copy mode) to scroll instead.
bind -n PPage previous-window
bind -n NPage next-window

# Workspaces (sessions): Alt+j / Alt+k
bind -n M-j switch-client -n
bind -n M-k switch-client -p

# Create: Alt+t = new tab (window). New workspaces come from Alt+f, then Alt+n
# in the picker (a project dir plus agent tab); a bare Alt+n session had neither.
bind -n M-t new-window -c "#{pane_current_path}"

# Close: Alt+q = close THIS workspace (session) — but only when safe. It refuses
# (and flashes why) if any tab has a running/pending agent (@agent_state) or an
# nvim with unsaved changes; otherwise idle agents/shells get a clean teardown.
# A ~1s debounce stops an accidental double-tap cascading into the next
# workspace. `q` breaks the alt+hjkl model on purpose — it's an action, not a
# direction. run-shell -b backgrounds the helper so its poll can't block tmux.
# See dot_local/bin/executable_tmux-session-close.
bind -n M-q run-shell -b "$HOME/.local/bin/tmux-session-close #{q:session_name} #{q:client_name}"

# Close: Alt+e = close THIS tab — the one-tab twin of Alt+q. It quits the agent
# in the pane (claude/codex/agy/pi/…), or asks an nvim to :qa and keeps the tab
# open if that refuses over unsaved changes, or sends `exit` to a shell sitting
# at its prompt. A pane running anything else swallows the keypress harmlessly.
# The agent case lives at the tmux level because none of those tools expose
# configurable key bindings themselves.
# See dot_local/bin/executable_tmux-pane-close.
bind -n M-e run-shell -b "$HOME/.local/bin/tmux-pane-close #{pane_id} #{q:client_name}"

# Projects: Alt+f = fuzzy project/workspace switcher popup ("find"). Lists every
# running workspace (session) plus every project under ~/workspace not yet open;
# type to filter, Enter to jump — switching to an open one, or creating its
# session and launching `cc` for a not-yet-open project. Alt+n (advertised in
# the picker's footer) instead prompts for a name and makes a fresh
# ~/workspace/<name>. The tmux twin of the snacks.nvim Projects picker, and the
# in-tmux counterpart to the `t` shell function.
# See dot_local/bin/executable_tmux-sessionizer.
#
# M-f only works here because Ghostty's default Alt+Right→esc:f mapping (same
# bytes as Alt+f) was remapped to a cursor CSI sequence — see the comment in
# dot_config/ghostty/config. Without that, Alt+Right would also open this popup.
bind -n M-f display-popup -E -B -w 60% -h 70% "$HOME/.local/bin/tmux-sessionizer"

# Rename: Alt+r = rename tab, Alt+Shift+r = rename workspace
# Alt+r starts with an empty prompt (type the new name fresh); Alt+Shift+r
# pre-fills the current session name so you can edit it.
# Alt+Shift+r is doubled (M-S-R / M-R) for the same reason as the swap keys
# above: extended-keys sends the CSI-u key M-S-R (uppercase + shift), legacy
# terminals send M-R.
bind -n M-r   command-prompt "rename-window -- '%%'"
bind -n M-S-R command-prompt -I "#S" "rename-session -- '%%'"
bind -n M-R   command-prompt -I "#S" "rename-session -- '%%'"

#### Prefix bindings (prefix is the default Ctrl-b) ####

# Reload this config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# prefix+w — overview of every workspace (session) and all its tabs (windows);
# -w hides panes, -Z zooms the picker to fill the pane. choose-tree prints a
# bracketed shortcut key on each row — press it to jump straight to that tab.
# The -F format tints each tab by @agent_state (same signal as the per-tab
# status dot): blue █ running, red █ needs-input, yellow █ done, yellow ░ idle, and
# nothing for non-agent tabs (shells, nvim). The tint carries into the tab name
# so a workspace that needs attention is scannable at a glance. Kept on one line
# on purpose — backslash continuations would fold stray whitespace into the
# format string.
bind w choose-tree -Zw -F "#{?session_format,#[fg=#{@thm_accent} bold]#{session_name}#[default]#[fg=#{@thm_fg_dim}]  #{session_windows} windows#{?session_attached, (attached),},window_format,#{?#{==:#{@agent_state},running},#[fg=#{@thm_blue}]█ ,#{?#{==:#{@agent_state},needs-input},#[fg=#{@thm_red}]█ ,#{?#{==:#{@agent_state},done},#[fg=#{@thm_yellow}]█ ,#{?#{==:#{@agent_state},idle},#[fg=#{@thm_yellow}]░ ,#[fg=#{@thm_fg}]  }}}}#{window_index}: #{window_name}#{window_flags},#[fg=#{@thm_fg_dim}]#{pane_current_command}}"

# prefix+o — agent overview: a full-screen snapshot montage of every session
# (one band per row) and its tabs (columns). Each window's screen is captured
# and tiled with a state-coloured title, for eyeballing several agents at once.
# Two views, switched with space and remembered between popups: a TREE of
# sessions and their tabs (the default — dot, name, git branch, peach ⑂ for a
# worktree, and a detail pane for whatever the cursor is on), and the original
# GRID montage. Navigate with hjkl/arrows + Enter to open, or hit a tab's 1-9/a-z
# key, or click it; in the tree l unfolds a session and h folds it. tab hides the
# detail pane (or the grid's snapshots), / narrows to tabs that ran an agent, and
# q/Esc closes (-E closes the popup when the script exits). -B drops the popup
# border so it fills the page.
# Overrides tmux's default prefix+o (rotate panes), which alt+hjkl makes
# redundant. See dot_local/bin/executable_tmux-overview.
bind o display-popup -E -B -w 100% -h 100% "$HOME/.local/bin/tmux-overview"

# Splits, opening in the current pane's directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix+u — pop up a menu to open something in the default browser: every
# running `make serve` across all sessions (keyed 1-9, from the @server_port we
# track) and every URL visible in the current pane (keyed a-z). Also replaces
# Ghostty's cmd-click-to-open, which `set -g mouse on` (below) swallows before
# Ghostty can see it. See dot_local/bin/executable_tmux-url-open.
bind u run-shell -b "$HOME/.local/bin/tmux-url-open"

# prefix+? — a centred cheatsheet of the keys worth knowing. Bare prefix
# (Ctrl-b) shows nothing on its own, which is baffling when you're new, so this
# replaces the default verbose `list-keys` help with a friendly menu. The key in
# (parentheses) on the right is tmux's own accelerator: press it to run that row
# (or use arrows + Enter). Rows without a (key) are headers or reference only —
# the Alt navigation keys at the bottom are pressed directly, with no prefix.
bind ? display-menu -T "#[align=centre fg=#{@thm_accent} bold] tmux cheatsheet " -x C -y C \
  "" \
  "-Workspaces & tabs"                  "" "" \
  "Find project / workspace"            f   { display-popup -E -B -w 60% -h 70% "$HOME/.local/bin/tmux-sessionizer" } \
  "Close this workspace (if idle)"      q   { run-shell -b "$HOME/.local/bin/tmux-session-close #{q:session_name} #{q:client_name}" } \
  "Sessions"                            s   { choose-tree -Zs } \
  "All workspaces + tabs"               w   { choose-tree -Zw } \
  "Overview — all tabs montage"         o   { display-popup -E -B -w 100% -h 100% "$HOME/.local/bin/tmux-overview" } \
  "Detach (tmux keeps running)"         d   { detach-client } \
  "" \
  "-This pane / tab"                    "" "" \
  "Split right"                         "|" { split-window -h -c "#{pane_current_path}" } \
  "Split down"                          "-" { split-window -v -c "#{pane_current_path}" } \
  "Zoom / unzoom pane"                  z   { resize-pane -Z } \
  "Scroll / copy mode"                  "[" { copy-mode } \
  "Open a server / URL"                 u   { run-shell -b "$HOME/.local/bin/tmux-url-open" } \
  "" \
  "-tmux itself"                        "" "" \
  "Reload config"                       r   { source-file ~/.tmux.conf } \
  "Command prompt"                      ":" { command-prompt } \
  "All key bindings (full list)"        "?" { list-keys } \
  "" \
  "-Move around — press directly, no prefix" "" "" \
  "-  Alt+h / Alt+l    prev / next tab"           "" "" \
  "-  Alt+j / Alt+k    prev / next workspace"     "" "" \
  "-  Alt+Shift+h / l  move tab left / right"     "" "" \
  "-  Alt+t  new tab"                            "" "" \
  "-  Alt+e  close tab       Alt+q  close workspace"           "" "" \
  "-         both refuse while nvim has unsaved changes"       "" "" \
  "-  Alt+f  find / switch to a project or workspace" "" "" \
  "-         (Alt+n in it: new project)"         "" "" \
  "-  Alt+r  rename tab   Alt+Shift+r  rename ws" "" ""

#### Behaviour ####

set -g mouse on
set -g base-index 1                # number tabs from 1
setw -g pane-base-index 1
set -g renumber-windows on         # keep tab numbers gapless
set -g detach-on-destroy off       # closing a workspace's last tab jumps to
                                   # another workspace instead of quitting tmux
set -g escape-time 10              # no lag after Esc (matters in vim)
set -g focus-events on              # also how agent-seen knows a tab is really
                                   # in front of you and not just on an unfocused
                                   # terminal — see the hooks further down
set -g history-limit 100000
set -g set-titles on
set -g set-titles-string "#S → #W"

# Auto-name unnamed windows after the running command (claude, nvim, node, …).
# Explicit renames (Alt+r) stick — tmux only auto-renames windows you haven't
# touched yourself.
set -g automatic-rename on

# Claude Code sets its process name to its version (e.g. "2.1.153"), so the
# default rename-format (#{pane_current_command}) would label the tab with a
# version number. Map any semver-looking command to "claude"; everything else
# keeps its command name. Single-quoted so the regex backslashes survive config
# parsing.
set -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'

# Don't let apps rename the window via OSC title escapes. The Antigravity CLI
# (agy) has a window-title feature (~/.gemini/antigravity-cli/title.sh) that emits
# OSC titles like "🏃 working · repo"; with allow-rename on, tmux would overwrite
# the window name (#W) with that and clobber the clean command-based name above
# (and duplicate the @agent_state dot). Off → automatic-rename stays authoritative
# inside tmux; agy's title only surfaces in a bare terminal tab (outside tmux),
# where it's genuinely useful.
set -g allow-rename off

# Pass through extended key sequences (CSI u / modifyOtherKeys) so apps and tmux
# itself can distinguish Shift/Ctrl-modified keys from their bare forms. Needed
# for the Alt+Shift tmux bindings above (M-S-H / M-S-L / M-S-R arrive as CSI-u
# uppercase+shift keys). The outer terminal (Ghostty, …) must already send these.
# (Shift+Enter for a newline is handled separately — Ghostty sends a bare LF for
# it, see dot_config/ghostty/config — so it doesn't rely on this.)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Report those modified keys downstream as CSI-u (Shift+Enter = ESC [ 13 ; 2 u)
# instead of tmux's default xterm modifyOtherKeys form (ESC [ 27 ; 2 ; 13 ~).
# Output side only — it never touches the M-S-H bindings above (those are what
# Ghostty sends *into* tmux), and a pane whose app never asks for extended keys
# gets identical bytes either way. Claude Code, Codex, nvim and pi all parse
# both forms, so the visible change is that pi stops warning at startup; csi-u
# is the shape the Kitty keyboard protocol uses, so it's what newer TUIs
# implement first. Server option: one format for every pane, no per-app
# scoping. Takes effect on reload (prefix+r) — no kill-server needed, whatever
# pi's docs say. Needs tmux >= 3.5.
set -s extended-keys-format csi-u

# Colours / truecolor
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# tmux 3.8 paints popups grey by default (bg=themedarkgrey), which washes out
# the Alt+f picker and the overview. Restore the pre-3.8 look: popups inherit
# the terminal background like a normal pane.
set -g popup-style default
set -g popup-border-style default

# Let apps send escape sequences straight through to the outer terminal,
# wrapped in tmux's DCS passthrough. Needed so neovim (snacks.image) can draw
# .png/.jpg previews via Ghostty's Kitty graphics protocol from inside tmux —
# without it the image escapes get swallowed and you see nothing. `on` (not
# `all`) only passes through for the visible pane, which is what we want.
# Harmless if no app uses it. Layering graphics under a multiplexer is imperfect
# (occasional redraw/scroll artifacts) — re-render with the snacks image command
# or :e! if one lingers.
set -gq allow-passthrough on

# Copy mode: vi keys; copy to the system clipboard (OSC52 — works over SSH)
setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

#### Silence tmux's built-in monitors ####
# The per-tab dot is driven entirely by @agent_state (set by the agent
# lifecycle hooks via the `agent-state` script), so tmux's own activity /
# silence / bell monitoring would only add noise — notably a grey "silence"
# dot on every quiet tab (nvim, shells). Turn it all off, and keep any stray
# BEL from a TUI from ringing through.
setw -g monitor-activity off
setw -g monitor-bell off
setw -g monitor-silence 0
set -g visual-bell off
set -g bell-action none

#### Status bar — colours from the palette at the top ####
# Layout:  [ session ▶ ]  tab  tab  [ active tab ]  tab  …   host  N  [ ● ● ○ ● ]
#    (the pink  plug shows only over SSH — see @ssh_plug below)
#   N — blue count of agents currently running server-wide (hidden when 0)
# Per-tab dot:  ● red needs-input · ● blue running · ● yellow done (finished,
#               not looked at yet) · ○ yellow idle (finished and seen)
# Far-right chip (where the clock used to be): one summary dot per session — same
# signal/palette as the per-tab dots, rolled up to the highest-priority state in
# each session, current session's cell highlighted (active-tab @thm_selection).
# See tmux-session-dots.
#
# Status bar bg uses mantle (@thm_bg_dark) locally, slightly darker than the
# pane base (@thm_bg) so the bar reads as a distinct strip below the panes. When
# the tmux server was started inside an SSH session the bar turns dark amber
# — unmistakable "this is remote" cue at a glance. Every status-bar element
# that wanted bg=mantle now references @status_bg so the transition glyphs
# stay seamless. -F resolves the palette colour now (see the palette notes).
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -gF @status_bg "#{@thm_ssh_bg}"' \
  'set -gF @status_bg "#{@thm_bg_dark}"'

# Over SSH, also show a small plug glyph just left of the host name — a dark
# pink / soft-red "you're connected remotely" marker that pairs with the amber
# bar above. Empty (no glyph, no trailing space) on a local server so the host
# sits flush against the agent count. Set once at server start like @status_bg.
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -gF @ssh_plug "#[fg=#{@thm_red_soft}]#[fg=#{@thm_fg_dim}] "' \
  'set -g @ssh_plug ""'

set -g status-position bottom
set -g status-interval 5
set -gF status-style "bg=#{@status_bg},fg=#{@thm_fg}"

# Session block — mauve "workspace" badge.  Goes red while the prefix key
# is held so you can see it's primed.  Powerline right-triangle ()
# transitions the fill colour into the status-bar bg.
set -g status-left-length 40
set -g status-left "#[bg=#{?client_prefix,#{@thm_red},#{@thm_accent}}#,fg=#{@thm_bg_dark}#,bold] #S #[bg=#{@status_bg}#,fg=#{?client_prefix,#{@thm_red},#{@thm_accent}}] "

# Window tabs — dim index, brighter name, then a trailing status cluster on the
# right edge of each tab. First, for a running server, the listening port(s) as
# green text on the tab's own background — no fill, so it reads as an annotation
# of the tab rather than a separate block; several ports show when a compose
# stack publishes more than one (@server_state / @server_port, set by the make
# wrapper — see dot_bash_aliases.tmpl and dot_local/bin/executable_server-state /
# server-port-watch); a … placeholder shows until a port is sniffed out. Then
# the agent-state dot driven by @agent_state (the Claude/Codex lifecycle hooks).
# Tabs that are neither set neither option, so they show nothing. Inactive and
# active tabs use identical logic:
#   server → green PORT(S) text (… until detected; lighter green on the active
#            tab so the current server tab stands out)
#   agent  → needs-input red ●   running blue ●   done yellow ●   idle
#            yellow ○   unset blank. Filled means it wants something from
#            you, hollow means it does not — so done and idle share the
#            colour and differ only in the glyph.
# Note: each agent branch carries its own leading space, so a non-agent tab adds
# no trailing gap.
# A finished agent's dot starts filled (● done, "you haven't looked at this yet")
# and opens (○ idle) once the tab has actually been in front of you. These are
# the four ways what's on screen changes; each hands agent-seen the window that
# just became visible, which is believable without any focus test because these
# only fire when you press something. -b so the hook never blocks the redraw.
# tmux-agent-count re-runs agent-seen every status tick to catch the rest — a
# turn that finished while you were already sitting in the tab, mainly.
set-hook -g session-window-changed  'run-shell -b "~/.local/bin/agent-seen #{window_id}"'
set-hook -g client-session-changed  'run-shell -b "~/.local/bin/agent-seen #{window_id}"'
set-hook -g client-attached         'run-shell -b "~/.local/bin/agent-seen #{window_id}"'
set-hook -g client-focus-in         'run-shell -b "~/.local/bin/agent-seen #{window_id}"'

set -g window-status-separator ""
set -g window-status-format "#[fg=#{@thm_muted}] #I #[fg=#{@thm_fg_sub}]#W#{?#{==:#{@server_state},running}, #[fg=#{@thm_green}]#{?#{@server_port},#{@server_port},…}#[default],}#{?#{==:#{@agent_state},needs-input}, #[fg=#{@thm_red}]●,#{?#{==:#{@agent_state},running}, #[fg=#{@thm_blue}]●,#{?#{==:#{@agent_state},done}, #[fg=#{@thm_yellow}]●,#{?#{==:#{@agent_state},idle}, #[fg=#{@thm_yellow}]○,}}}} "
# Active tab — surface1 bg, bold blue name, mauve index for accent.
set -g window-status-current-format "#[bg=#{@thm_selection},fg=#{@thm_accent},bold] #I #[fg=#{@thm_blue}]#W#{?#{==:#{@server_state},running}, #[fg=#{@thm_green_tint}]#{?#{@server_port},#{@server_port},…}#[fg=#{@thm_fg}],}#{?#{==:#{@agent_state},needs-input}, #[fg=#{@thm_red}]●,#{?#{==:#{@agent_state},running}, #[fg=#{@thm_blue}]●,#{?#{==:#{@agent_state},done}, #[fg=#{@thm_yellow}]●,#{?#{==:#{@agent_state},idle}, #[fg=#{@thm_yellow}]○,}}}} "

# Right side — where the active tab sits in git, then host, then the session-dots
# chip. In the primary checkout that's the focused pane's branch, in green; in a
# linked worktree it's a peach "⑂ <dir>" instead, and the branch is left off —
# the worktree directory is named after its branch, so the two together said the
# same word twice. See dot_local/bin/executable_tmux-git-branch. Since agents run
# in per-worktree tabs on different branches, this answers "what is this tab
# checked out on?" without inflating every tab label.
#
# The far-right chip replaces the old %H:%M clock with a row of summary dots, one
# per session, coloured by that session's highest-priority @agent_state (red
# needs-input ● > yellow done ● > blue running ● > yellow idle ○ > grey none ●),
# current session
# bracketed. So a glance at the bar counts how many workspaces are working or
# waiting on me — the whole-server roll-up of the per-tab dots and the alt+f
# finder, current session's
# cell highlighted with the active-tab surface (@thm_selection) — same "you are here"
# cue as the active window tab. The chip sets bg=@thm_surface and tmux-session-dots emits
# only #[fg=...]/#[bg=...] (tmux re-expands those #[...] from #() output).
#
# Just left of the chip, next to the host, a blue number counts how many agents
# are running (working) right now across the whole server — a quick "how much is
# in flight" figure, hidden entirely when nothing is running. See
# dot_local/bin/executable_tmux-agent-count.
# Length bumped 80→150 so a long branch plus many session dots aren't truncated.
set -g status-right-length 150
# While the prefix is armed, a pink "? help" chip appears here (left of the
# branch) nudging you to the prefix+? cheatsheet — same pink as the session badge.
set -g status-right "#{?client_prefix,#[fg=#{@thm_bg_dark} bg=#{@thm_red} bold] ? help #[default]  ,}#[fg=#{@thm_green}]#(~/.local/bin/tmux-git-branch #{q:pane_current_path})  #{@ssh_plug}#[fg=#{@thm_fg_dim}]#H #(~/.local/bin/tmux-agent-count)#[bg=#{@thm_surface}]#(~/.local/bin/tmux-session-dots #{q:session_name})#[default]"

set -gF pane-border-style "fg=#{@thm_surface}"
set -gF pane-active-border-style "fg=#{@thm_accent}"
set -gF message-style "bg=#{@thm_surface},fg=#{@thm_fg}"

# Selected-row highlight in choose-tree (prefix+w) and copy mode. A neutral
# surface-grey bg (matching the active tab) replaces tmux's default yellow, so
# the @agent_state foreground tints in the workspace overview stay readable when
# a row is selected — yellow text on a yellow highlight would otherwise vanish.
set -gF mode-style "bg=#{@thm_selection},fg=#{@thm_fg}"

#### Session persistence across reboots ####
# tmux-resurrect saves/restores sessions, windows, panes, their working
# directories and layouts (prefix+Ctrl-s saves, prefix+Ctrl-r restores by hand).
# tmux-continuum automates it: a save every 15 minutes and a restore when the
# tmux server starts. Plugins come from .chezmoiexternal.toml (no TPM).
#
# Only resurrect's default program list is relaunched (vim, less, top, …).
# Claude Code and Codex panes are handled by tmux-claude-sessions instead: saves
# record which conversation runs in which pane, and after a restore it types
# `claude --resume <id>` or `codex resume <id>` into that pane. Codex's lifecycle
# hooks record its conversation id per pane. Letting resurrect relaunch the
# agents itself would start fresh conversations instead of resuming the old ones.
#
# Must stay at the end of this file: continuum hooks its autosave into
# status-right, so a later `set -g status-right` would silently disable it.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-claude-sessions save'
set -g @resurrect-hook-post-restore-all '~/.local/bin/tmux-claude-sessions restore'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
